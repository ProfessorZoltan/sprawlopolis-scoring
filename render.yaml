# Render Blueprint for the Sprawlopolis Scorer.
# Docs: https://render.com/docs/blueprint-spec
#
# Serves the static app. No server-side secrets are needed: the manual form
# is fully client-side, and photo mode calls the Anthropic API directly from
# the browser using the user's own key (stored only in their browser).
services:
  - type: web
    name: sprawlopolis-scorer
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
