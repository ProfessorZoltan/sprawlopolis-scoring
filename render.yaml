# Render Blueprint for the Sprawlopolis Scorer.
# Docs: https://render.com/docs/blueprint-spec
#
# Deploys the Express server that serves the static app and the
# /api/interpret photo endpoint. The manual form works with no config;
# photo mode needs ANTHROPIC_API_KEY (set it in the Render dashboard).
services:
  - type: web
    name: sprawlopolis-scorer
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # secret — enter in the Render dashboard; leave unset for manual-only
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
